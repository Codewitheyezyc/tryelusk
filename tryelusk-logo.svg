<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 140" width="480" height="140">
  <defs>
    <radialGradient id="irisGradient" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#A78BFF"/>
      <stop offset="100%" stop-color="#6D3EFF"/>
    </radialGradient>
  </defs>

  <rect width="480" height="140" fill="#0B0B0F"/>

  <!-- Aperture / iris mark -->
  <g transform="translate(70,70)">
    <g fill="url(#irisGradient)">
      <polygon points="0,0 0,-38 15,-30" transform="rotate(0)"/>
      <polygon points="0,0 0,-38 15,-30" transform="rotate(60)"/>
      <polygon points="0,0 0,-38 15,-30" transform="rotate(120)"/>
      <polygon points="0,0 0,-38 15,-30" transform="rotate(180)"/>
      <polygon points="0,0 0,-38 15,-30" transform="rotate(240)"/>
      <polygon points="0,0 0,-38 15,-30" transform="rotate(300)"/>
    </g>
    <circle r="10" fill="#0B0B0F"/>
  </g>

  <!-- Wordmark -->
  <text x="130" y="86" font-family="'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="500" letter-spacing="0.5" fill="#8B8B96">Try<tspan fill="#F2F2F5" font-weight="700">Elusk</tspan></text>
</svg>
